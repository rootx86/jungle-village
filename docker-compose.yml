# Development:  docker compose up -d                  (Postgres only; run backend and frontend with npm)
# Production:   docker compose --profile app up -d --build   (Postgres + API + website + nginx on HTTP_PORT)
services:
  db:
    image: postgres:16-alpine
    container_name: jungle-village-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jungle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jungle}
      POSTGRES_DB: ${POSTGRES_DB:-jungle}
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - jungle_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jungle} -d ${POSTGRES_DB:-jungle}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      BACKEND_PORT: "3001"
      DATABASE_URL: postgres://${POSTGRES_USER:-jungle}:${POSTGRES_PASSWORD:-jungle}@db:5432/${POSTGRES_DB:-jungle}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN (16+ random characters) in .env}
      CHANNEL_NAME: ${CHANNEL_NAME:-My Channel}
      SEED_DEMO: ${SEED_DEMO:-false}
      YT_MODE: ${YT_MODE:-apikey}
      YT_API_KEY: ${YT_API_KEY:-}
      YT_CHANNEL_ID: ${YT_CHANNEL_ID:-}
      YT_POLL_INTERVAL_SEC: ${YT_POLL_INTERVAL_SEC:-300}
      YT_BACKFILL_LIMIT: ${YT_BACKFILL_LIMIT:-0}
      YT_OAUTH_CLIENT_ID: ${YT_OAUTH_CLIENT_ID:-}
      YT_OAUTH_CLIENT_SECRET: ${YT_OAUTH_CLIENT_SECRET:-}
      YT_OAUTH_REFRESH_TOKEN: ${YT_OAUTH_REFRESH_TOKEN:-}
    read_only: true
    security_opt: ["no-new-privileges:true"]

  frontend:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
    restart: unless-stopped
    depends_on: [backend]
    read_only: true
    tmpfs: ["/tmp", "/app/frontend/.next/cache"]
    security_opt: ["no-new-privileges:true"]

  proxy:
    profiles: ["app"]
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [frontend, backend]
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  jungle_pgdata:
